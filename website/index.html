<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhankas Cast | Cinematic Podcast Gallery</title>
    <meta name="description" content="Experience the Bhankas Podcast in a premium cinematic gallery. Watch the latest episodes with a stunning movies-style UI.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-accent">BHANKAS</span> CAST
            </div>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="api.html" class="nav-link">API Documentation</a>
            </nav>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search for episodes or stories...">
                <div class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Watch <span>Premium</span> Stories</h1>
                <p>Dive into the world of horror and deep conversations. Explore our library of cinematic podcast episodes.</p>
            </div>
        </section>

        <section class="video-feed">
            <div class="container" id="videoContainer">
                <div class="loader">Loading Cinematic Experience...</div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Bhankas Cast. Premium Streaming Experience.</p>
            <div class="footer-links">
                <a href="https://www.youtube.com/@BhankasPodcast" target="_blank">YouTube Official</a>
                <a href="#">Instagram</a>
                <a href="#">Spotify</a>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
