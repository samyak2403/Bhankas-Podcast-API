<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhankas Podcast | Watch All Episodes</title>
    <meta name="description" content="Discover the latest episodes of Bhankas Podcast. Watch high-quality video content directly from our official YouTube feed.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-accent">BHANKAS</span> PODCAST
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search episodes...">
                <div class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Listen to the Unheard</h1>
                <p>Welcome to the official hub of Bhankas Podcast. Explore our library of insightful conversations and horror stories.</p>
            </div>
        </section>

        <section class="video-feed">
            <div class="container" id="videoContainer">
                <!-- Videos will be injected here by JS -->
                <div class="loader">Loading episodes...</div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Bhankas Podcast. All rights reserved.</p>
            <div class="footer-links">
                <a href="https://www.youtube.com/@BhankasPodcast" target="_blank">YouTube</a>
                <a href="#">Instagram</a>
                <a href="#">Spotify</a>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
